# Example ModSync instruction file for KOTOR 1.
# End users do not edit this file. It exists to exercise the installer and the
# editor. GUIDs are stable so that other files can reference these mods.

[Config]
Name = "Example KOTOR 1 build"
TargetGame = "KOTOR1"
Version = "example-1"
Author = "ModSync"
CompatibilityLevel = "Compatible"
BeforeModListContent = """
## Before you start

This is an **example** instruction file. It references archives that you must
place in your mod directory yourself. Nothing here is downloaded automatically.
"""
WidescreenSectionContent = """
Widescreen mods change the game executable and GUI files. They are optional and
are installed in a separate phase after the base build.
"""

[[thisMod]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000001}"
Name = "KOTOR 1 Community Patch"
Description = "A compilation of bug fixes for KOTOR 1."
Author = "A Future Pilot, JCarter426, and many others"
Tier = "1 - Essential"
Category = ["Bugfix"]
Language = "YES"
InstallationMethod = "TSLPatcher"
ModLink = ["https://deadlystream.com/files/file/1258-kotor-1-community-patch/"]
IsSelected = true

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000011}"
Action = "Extract"
Source = ["<<modDirectory>>\\KOTOR 1 Community Patch*.zip"]
Overwrite = true

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000012}"
Action = "Patcher"
Source = ["<<modDirectory>>\\KOTOR 1 Community Patch*\\tslpatchdata"]
Destination = "<<kotorDirectory>>"
Overwrite = true

[[thisMod]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000002}"
Name = "Ultimate Dantooine High Resolution"
Description = "High resolution textures for Dantooine."
Author = "ShiningRedHD"
Tier = "2 - Recommended"
Category = ["Graphics Improvement"]
Language = "YES"
InstallationMethod = "Loose-File"
ModLink = ["https://www.nexusmods.com/kotor/mods/1103"]
InstallAfter = ["{1F0A5B58-0F0D-4B0F-9B9F-000000000001}"]
IsSelected = true

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000021}"
Action = "Extract"
Source = ["<<modDirectory>>\\Ultimate Dantooine High Resolution*.zip"]

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000022}"
Action = "Delete"
Source = [
  "<<modDirectory>>\\Ultimate Dantooine High Resolution*\\DAN_wall03.tpc",
  "<<modDirectory>>\\Ultimate Dantooine High Resolution*\\DAN_NEW1.tpc",
]

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000023}"
Action = "Move"
Source = ["<<modDirectory>>\\Ultimate Dantooine High Resolution*\\*"]
Destination = "<<kotorDirectory>>\\Override"
Overwrite = true

[[thisMod]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000003}"
Name = "HD Astromechs"
Description = "HD astromech droid textures."
Author = "Dark Hope"
Tier = "3 - Suggested"
Category = ["Graphics Improvement"]
InstallationMethod = "Loose-File"
ModLink = ["https://deadlystream.com/files/file/1500-hd-astromechs/"]
IsSelected = false

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000031}"
Action = "Extract"
Source = ["<<modDirectory>>\\HD Astromechs*.zip"]

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000032}"
Action = "Move"
Source = ["<<modDirectory>>\\HD Astromechs*\\*"]
Destination = "<<kotorDirectory>>\\Override"

[[thisMod]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000004}"
Name = "Character Textures and Model Fixes"
Description = "Fixes for character textures and models. Uses a cleanlist so it never overwrites HD textures you selected."
Author = "RedRob41"
Tier = "2 - Recommended"
Category = ["Bugfix", "Graphics Improvement"]
InstallationMethod = "Loose-File"
ModLink = ["https://deadlystream.com/files/file/2000-character-textures-and-model-fixes/"]
InstallAfter = ["{1F0A5B58-0F0D-4B0F-9B9F-000000000003}"]
IsSelected = true

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000041}"
Action = "Extract"
Source = ["<<modDirectory>>\\Character Textures and Model Fixes*.zip"]

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000042}"
Action = "CleanList"
Source = ["<<modDirectory>>\\Character Textures and Model Fixes*\\cleanlist_k1.txt"]
Destination = "<<modDirectory>>\\Character Textures and Model Fixes*\\Override"

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000043}"
Action = "Move"
Source = ["<<modDirectory>>\\Character Textures and Model Fixes*\\Override\\*"]
Destination = "<<kotorDirectory>>\\Override"
Overwrite = true

[[thisMod]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000005}"
Name = "Visually Repair HK-47"
Description = "Repairs HK-47's damaged texture. Choose which droids are affected."
Author = "Sith Holocron"
Tier = "4 - Optional"
Category = ["Appearance Change"]
InstallationMethod = "Loose-File"
ModLink = ["https://deadlystream.com/files/file/1200-visually-repair-hk-47/"]
IsSelected = true

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000051}"
Action = "Extract"
Source = ["<<modDirectory>>\\Visually Repair HK-47*.zip"]

[[thisMod.Options]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-00000000005A}"
Name = "HK-47 only"
Description = "Only HK-47 receives the repaired texture."
Restrictions = ["{1F0A5B58-0F0D-4B0F-9B9F-00000000005B}"]
ExclusiveGroup = "hk"
IsSelected = true

[[thisMod.Options.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-00000000005C}"
Action = "Move"
Source = ["<<modDirectory>>\\Visually Repair HK-47*\\HK-47 only\\*"]
Destination = "<<kotorDirectory>>\\Override"

[[thisMod.Options]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-00000000005B}"
Name = "HK-47 and HK-50/51"
Description = "All HK units receive the repaired texture."
Restrictions = ["{1F0A5B58-0F0D-4B0F-9B9F-00000000005A}"]
ExclusiveGroup = "hk"
IsSelected = false

[[thisMod.Options.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-00000000005D}"
Action = "Move"
Source = ["<<modDirectory>>\\Visually Repair HK-47*\\All HK\\*"]
Destination = "<<kotorDirectory>>\\Override"

[[thisMod]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000006}"
Name = "Widescreen UI Fix"
Description = "GUI files resized for widescreen resolutions."
Author = "ndix UR"
Tier = "4 - Optional"
Category = ["Widescreen", "UI"]
InstallationMethod = "Loose-File"
ModLink = ["https://deadlystream.com/files/file/1400-widescreen-ui-fix/"]
IsWidescreen = true
IsSelected = false

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000061}"
Action = "Extract"
Source = ["<<modDirectory>>\\Widescreen UI Fix*.zip"]

[[thisMod.Instructions]]
Guid = "{1F0A5B58-0F0D-4B0F-9B9F-000000000062}"
Action = "Choose"
Source = ["<<modDirectory>>\\Widescreen UI Fix*\\*"]
Destination = "<<kotorDirectory>>\\Override"
Overwrite = true
